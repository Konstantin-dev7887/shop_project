<!DOCTYPE html>
  <html>
  <head>
      <title>{{ product.name }}</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="container mt-4">
      <h1>{{ product.name }}</h1>
      {% if product.image %}
          <img src="{{ product.image.url }}" class="img-fluid mb-3" style="max-height: 300px;">
      {% endif %}
      <p><strong>Описание:</strong> {{ product.description }}</p>
      <p><strong>Цена:</strong> {{ product.price }} руб.</p>
      <a href="{% url 'catalog:product_list' %}" class="btn btn-secondary">Назад к списку</a>
      <a href="{% url 'catalog:product_update' product.pk %}" class="btn btn-warning">Редактировать</a>
      <a href="{% url 'catalog:product_delete' product.pk %}" class="btn btn-danger">Удалить</a>
  </body>
  </html>
