  <!DOCTYPE html>
  <html>
  <head>
      <title>{% if form.instance.pk %}Редактирование{% else %}Создание{% endif %} продукта</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="container mt-4">
      <h1>{% if form.instance.pk %}Редактировать{% else %}Создать{% endif %} продукт</h1>
      <form method="post" enctype="multipart/form-data">
          {% csrf_token %}
          {% for field in form %}
              <div class="mb-3">
                  <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                  {{ field }}
                  {% if field.help_text %}
                      <div class="form-text">{{ field.help_text }}</div>
                  {% endif %}
                  {% for error in field.errors %}
                      <div class="invalid-feedback d-block">{{ error }}</div>
                  {% endfor %}
              </div>
          {% endfor %}
          <button type="submit" class="btn btn-success">Сохранить</button>
          <a href="{% url 'catalog:product_list' %}" class="btn btn-secondary">Отмена</a>
      </form>
  </body>
  </html>
